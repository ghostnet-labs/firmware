name: Build Firmware

on:
  workflow_call:
    inputs:
      board:
        description: 'Board name (e.g., ekh-bcm2711)'
        required: true
        type: string
      target:
        description: 'OpenWrt target platform (e.g., bcm27xx)'
        required: true
        type: string
      subtarget:
        description: 'OpenWrt subtarget (e.g., bcm2711)'
        required: true
        type: string
      description:
        description: 'Human-readable description of supported hardware'
        required: true
        type: string
      releasepackages:
        description: 'Upload built packages as artifacts for release publishing'
        required: false
        type: boolean
        default: false
      cpu_arch:
        description: 'CPU architecture directory name under bin/packages/ (e.g., aarch64_cortex-a72). Leave empty to skip arch package upload.'
        required: false
        type: string
        default: ''
      self_hosted:
        description: 'Build on the Mac Studio build VMs (openwrt-build). Only for trusted callers without secrets, such as the scheduled full build.'
        required: false
        type: boolean
        default: false
      ref:
        description: 'Commit to build. Empty builds the commit that triggered the caller.'
        required: false
        type: string
        default: ''
    secrets:
      USIGN_PRIVATE_KEY:
        description: 'usign private key used to sign package indexes. Optional; an ephemeral key is generated when absent.'
        required: false
      USIGN_PUBLIC_KEY:
        description: 'usign public key matching USIGN_PRIVATE_KEY, installed into images as the trusted opkg key.'
        required: false

jobs:
  build:
    name: Build ${{ inputs.board }}
    # Same-repo pull requests and the scheduled full build (self_hosted)
    # build on the Mac Studio build VMs; fork pull requests and release
    # builds (which carry the signing key) stay on GitHub-hosted runners.
    runs-on: ${{ ((inputs.self_hosted && github.event_name != 'pull_request') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "openwrt-build"]') || 'ubuntu-24.04' }}
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Free up disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex g++ gawk gcc-multilib g++-multilib git gettext \
            libncurses5-dev libssl-dev python3-setuptools rsync unzip golang-go zlib1g-dev swig file wget libnl-3-dev \
            libnl-genl-3-dev libgps-dev libcap-dev pkg-config libopus-dev \
            libopusfile-dev portaudio19-dev net-tools libpcre3-dev libpcre3 upx-ucl python3-pyelftools

      - name: Check build dependencies are installed
        # Preinstalled in the build VM: its runner user has no sudo.
        # gcc-multilib is not packaged for arm64 and is not needed for these targets.
        if: runner.environment != 'github-hosted'
        run: |
          dpkg-query -W build-essential clang flex gawk git gettext libncurses-dev \
            libssl-dev python3-setuptools rsync unzip golang-go zlib1g-dev swig file \
            wget libnl-3-dev libnl-genl-3-dev libgps-dev libcap-dev pkg-config \
            libopus-dev libopusfile-dev portaudio19-dev net-tools libpcre3-dev upx-ucl python3-pyelftools >/dev/null
          # dockerd's hack/make/binary-daemon copies containerd, ctr and friends
          # into its bundle when the target arch matches the host (arm64 on
          # these VMs) and /usr/local/bin/runc exists. Lima's default containerd
          # provisioning installs runc there without the rest, so dockerd fails
          # with "cp: cannot stat ''" after a long build. Fail fast instead.
          if [ -x /usr/local/bin/runc ]; then
            echo "::error::/usr/local/bin/runc exists in this build VM, which breaks the dockerd package on an arm64 host. Set 'containerd: {system: false, user: false}' in the VM's lima.yaml and move Lima's nerdctl-full binaries out of /usr/local/bin."
            exit 1
          fi

      - name: Setup cache
        # Hosted runners only. Build VMs keep dl/ in a persistent folder
        # instead (next step), because their cleanup step deletes the
        # workspace before actions/cache could save it.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: |
            dl
          key: ${{ inputs.board }}-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}

      - name: Use persistent download and compiler caches on the build VM
        if: runner.environment != 'github-hosted'
        run: |
          cache_root="${OPENWRT_CI_CACHE:-$HOME/.cache/openwrt-ci}"
          mkdir -p "$cache_root/dl" "$cache_root/ccache"
          # Source archives are versioned by name, so one shared folder serves
          # every board. Drop archives no build has read for 30 days.
          find "$cache_root/dl" -type f -atime +30 -delete || true
          rm -rf dl
          ln -s "$cache_root/dl" dl
          echo "OPENWRT_CI_CACHE=$cache_root" >> "$GITHUB_ENV"
          # Read by the ccache that OpenWrt builds in staging_dir/host. The
          # build step turns ccache on with make variables, so .config (and
          # with it the image contents) is the same as without the cache.
          {
            echo "CCACHE_DIR=$cache_root/ccache"
            echo "CCACHE_MAXSIZE=12G"
            echo "CCACHE_SLOPPINESS=file_macro,locale,time_macros,include_file_ctime,include_file_mtime"
          } >> "$GITHUB_ENV"
          du -sh "$cache_root/dl" "$cache_root/ccache"
          df -h "$cache_root"

      - name: Use HTTPS for GitHub clones in CI
        run: |
          # Both rewrites target the same config key, so the second must use
          # --add; a plain `git config` would replace the first value and leave
          # scp-style git@github.com: URLs (used by openmanetd submodules)
          # untouched.
          git config --global --unset-all url."https://github.com/".insteadOf || true
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git://github.com/"
          git config --global --get-all url."https://github.com/".insteadOf
          # Fail fast if the rewrite is broken: these are the exact URL forms
          # the openmanetd submodules use, and the runner has no SSH keys, so
          # without a working rewrite these die here in seconds instead of
          # hours into the build.
          GIT_TERMINAL_PROMPT=0 git ls-remote git@github.com:OpenMANET/go-alfred.git HEAD
          GIT_TERMINAL_PROMPT=0 git ls-remote ssh://git@github.com/OpenMANET/protobufs.git HEAD

      - name: Configure build for ${{ inputs.board }}
        run: |
          ./scripts/openmanet_setup.sh -i -b ${{ inputs.board }}

      # The feed's Go bootstrap chain starts from go1.4, which cannot build
      # on an arm64 host. Bootstrap from the VM's packaged Go instead.
      - name: Use the host Go as the Go bootstrap on arm64
        if: runner.arch == 'ARM64'
        run: |
          root="$(go env GOROOT)"
          echo "Go bootstrap root: $root ($(go version))"
          sed -i '/^CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT=/d' .config
          echo "CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT=\"$root\"" >> .config
          make defconfig
          grep '^CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT=' .config

      - name: Install package signing key
        if: inputs.releasepackages
        env:
          USIGN_PRIVATE_KEY: ${{ secrets.USIGN_PRIVATE_KEY }}
          USIGN_PUBLIC_KEY: ${{ secrets.USIGN_PUBLIC_KEY }}
        run: |
          if [ -z "$USIGN_PRIVATE_KEY" ] || [ -z "$USIGN_PUBLIC_KEY" ]; then
            echo "Signing key secrets unavailable; build will generate an ephemeral key."
            exit 0
          fi
          # usign requires the two-line signify format; restore the comment
          # line if the secret holds only the base64 key material.
          write_key() {
            dest="$1"; content="$2"; comment="$3"
            case "$content" in
              "untrusted comment:"*) printf '%s\n' "$content" > "$dest" ;;
              *)
                printf 'untrusted comment: %s\n' "$comment" > "$dest"
                printf '%s\n' "$content" >> "$dest"
                ;;
            esac
          }
          write_key key-build "$USIGN_PRIVATE_KEY" "OpenMANET packages private key"
          write_key key-build.pub "$USIGN_PUBLIC_KEY" "OpenMANET packages public key"
          chmod 600 key-build
          echo "Installed persistent package signing key."

      - name: Download dependencies
        run: |
          make download -j$(nproc)

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          ccache_args=()
          if [ -n "${CCACHE_DIR:-}" ]; then
            # Command-line variables override .config for every sub-make
            # without changing .config itself. CONFIG_CCACHE needs DEVEL to
            # survive defconfig, and DEVEL changes other defaults.
            ccache_args=(CONFIG_CCACHE=y "CONFIG_CCACHE_DIR=$CCACHE_DIR")
          fi
          make -j$(nproc) V=s "${ccache_args[@]}" 2>&1 | tee build.log
          echo "Build completed for ${{ inputs.board }}"
          if [ -n "${CCACHE_DIR:-}" ] && [ -x staging_dir/host/bin/ccache ]; then
            echo "=== ccache for this build ==="
            staging_dir/host/bin/ccache --show-stats || true
            # Stats are kept in CCACHE_DIR; zero them so the next job's
            # numbers cover only that job.
            staging_dir/host/bin/ccache --zero-stats >/dev/null || true
          fi

      - name: Check build output
        run: |
          ls -lah bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/
          echo "=== Images created ==="
          find bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/ -name "*.img.gz" -o -name "*.bin"
          echo "=== Build info files ==="
          find bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/ -name "*.buildinfo"

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/${{ inputs.board }}
          cp bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/*.img.gz artifacts/${{ inputs.board }}/ 2>/dev/null || true
          cp bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/*sysupgrade.bin artifacts/${{ inputs.board }}/ 2>/dev/null || true
          cp bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/sha256sums artifacts/${{ inputs.board }}/ 2>/dev/null || true
          echo "Board: ${{ inputs.board }}" > artifacts/${{ inputs.board }}/BOARD_INFO.txt
          echo "Description: ${{ inputs.description }}" >> artifacts/${{ inputs.board }}/BOARD_INFO.txt
          echo "Target: ${{ inputs.target }}/${{ inputs.subtarget }}" >> artifacts/${{ inputs.board }}/BOARD_INFO.txt
          echo "Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> artifacts/${{ inputs.board }}/BOARD_INFO.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ inputs.board }}
          path: artifacts/${{ inputs.board }}/*
          if-no-files-found: error
          retention-days: 5

      - name: Upload target packages
        if: inputs.releasepackages
        uses: actions/upload-artifact@v7
        with:
          name: packages-targets-${{ inputs.target }}--${{ inputs.subtarget }}
          path: bin/targets/${{ inputs.target }}/${{ inputs.subtarget }}/packages/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload arch packages
        if: inputs.releasepackages && inputs.cpu_arch != ''
        uses: actions/upload-artifact@v7
        with:
          name: packages-arch-${{ inputs.cpu_arch }}
          path: bin/packages/${{ inputs.cpu_arch }}/
          if-no-files-found: warn
          retention-days: 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ inputs.board }}
          path: build.log
          retention-days: 30

      - name: Free disk for the next build
        # dl/ is a symlink to the persistent cache, so this removes only the
        # link. The ccache folder lives outside the workspace.
        if: always() && runner.environment != 'github-hosted'
        run: |
          rm -rf build_dir staging_dir tmp bin dl feeds artifacts build.log key-build key-build.pub
          df -h "$GITHUB_WORKSPACE"
