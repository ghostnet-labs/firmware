name: Build Firmware (PR) on NanoPC-T6 LTS

# actions: read lets the board build reuse an earlier build of the same inputs.
permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
  pull_request:
    # Changes that touch every board (feeds pin, boards/common, the setup
    # script, build-firmware.yml) build only the smoke set on PRs: x86-64,
    # ekh-bcm2712 and halowlink2. This board is still built on PRs that
    # change its own files or the kernel, and by the 6-hourly full build
    # on 24.10 (build-full.yml).
    paths:
    - 'boards/nanopc-t6/**'
    - 'patches/nanopc-t6/**'
    - '.github/workflows/build-pr-nanopc-t6.yml'
    - 'include/kernel*'
    - 'package/kernel/**'
    - 'package/boot/uboot-rockchip/**'
    - 'package/boot/arm-trusted-firmware-rockchip/**'
    - 'target/linux/rockchip/**'

# A new PR revision supersedes the previous full image build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-nanopc-t6:
    name: Build nanopc-t6
    uses: ./.github/workflows/build-firmware.yml
    with:
      board: nanopc-t6
      target: rockchip
      subtarget: armv8
      description: "FriendlyElec NanoPC-T6 LTS (RK3588)"
