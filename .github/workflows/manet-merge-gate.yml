name: Manet merge gate
on:
  pull_request:
    # closed: a new run in the same concurrency group cancels any gate still
    # waiting on a PR that was just merged or closed; the job itself is skipped.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, closed]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: manet-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  gate:
    name: Manet merge gate
    if: github.event.action != 'closed'
    # Same-repo PRs use the small ghostnet-gate ARC pool (256 MiB pods) so a
    # gate that polls for hours does not hold a macOS slot. Fork PRs stay on
    # hosted runners.
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'ghostnet-gate' || 'ubuntu-latest' }}
    timeout-minutes: 730
    steps:
      - name: Install the GitHub CLI when the runner image lacks it
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            exit 0
          fi
          version=2.63.2
          case "$(uname -m)" in
            aarch64|arm64) arch=arm64 ;;
            *) arch=amd64 ;;
          esac
          curl -fsSL "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_linux_${arch}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${version}_linux_${arch}/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          repository: ghostnet-labs/docs
          ref: 653380a58247c0e9dd6231627b13ecef7f69fcbe
          persist-credentials: false
      - name: Verify merge policy regression suite
        run: python3 -m unittest discover -s project/tests -v
      - name: Wait for applicable current-head tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 project/scripts/merge_policy.py gate --repo "$REPO" --pr "$PR" --sha "$SHA" --timeout 43200
