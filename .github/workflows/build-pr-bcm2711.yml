name: Build Firmware (PR) on bcm2711

# actions: read lets the board build reuse an earlier build of the same inputs.
permissions:
  actions: read
  contents: read

on:
  pull_request:
    # Changes that touch every board (feeds pin, boards/common, the setup
    # script, build-firmware.yml) build only the smoke set on PRs: x86-64,
    # ekh-bcm2712 and halowlink2. This board is still built on PRs that
    # change its own files or the kernel, and by the 6-hourly full build
    # on 24.10 (build-full.yml).
    paths:
    - 'boards/ekh-bcm2711/**'
    - 'patches/ekh-bcm2711/**'
    - '.github/workflows/build-pr-bcm2711.yml'
    - 'include/kernel*'
    - 'package/kernel/**'
    - 'target/linux/bcm27xx/**'

# A new PR revision supersedes the previous full image build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-ekh-bcm2711:
    name: Build ekh-bcm2711
    uses: ./.github/workflows/build-firmware.yml
    with:
      board: ekh-bcm2711
      target: bcm27xx
      subtarget: bcm2711
      description: "Raspberry Pi 4, CM4"
