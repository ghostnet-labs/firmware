name: Build Firmware (PR) on bcm2711

# actions: read lets the board build reuse an earlier build of the same inputs.
permissions:
  actions: read
  contents: read
  pull-requests: read

on:
  pull_request:
    # Changes that touch every board (feeds pin, boards/common, the setup
    # script, build-firmware.yml) build only the smoke set on PRs: x86-64,
    # ekh-bcm2712 and halowlink2. This board is still built on PRs that
    # change its own files or the kernel, and by the 6-hourly full build
    # on 24.10 (build-full.yml).
    paths:
    - 'boards/ekh-bcm2711/**'
    - 'patches/ekh-bcm2711/**'
    - '.github/workflows/build-pr-bcm2711.yml'
    - 'include/kernel*'
    - 'package/kernel/**'
    - 'target/linux/bcm27xx/**'

# A new PR revision supersedes the previous full image build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A PR labelled `hold` is waiting its turn on the shared openwrt-build
  # runners. Read its labels live (not from the event) so that re-running this
  # workflow after `hold` comes off builds the board; hold-builds.yml cancels
  # running builds when `hold` is added and re-runs them when it is removed.
  hold:
    name: Check hold label (${{ github.workflow }})
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      held: ${{ steps.check.outputs.held }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          held=false
          if [ -n "$PR" ]; then
            held=$(gh api "repos/$REPO/issues/$PR/labels" --jq 'any(.[]; .name == "hold")')
          fi
          echo "held=$held" >> "$GITHUB_OUTPUT"
          if [ "$held" = true ]; then
            echo "::notice::PR is on hold; skipping the board build until the label is removed."
          fi

  build-ekh-bcm2711:
    needs: hold
    if: needs.hold.outputs.held != 'true'
    name: Build ekh-bcm2711
    uses: ./.github/workflows/build-firmware.yml
    with:
      board: ekh-bcm2711
      target: bcm27xx
      subtarget: bcm2711
      description: "Raspberry Pi 4, CM4"
