name: PR Gate

# The board, kernel, toolchain and tools builds only run when a PR touches
# their paths, so none of them can be a required status check. This job runs
# on every PR, waits for whatever other checks the PR started, and fails if
# any of them failed. Require "PR gate" in the default-branch ruleset.

on:
  pull_request:
    # The defaults plus closed: a closed or merged PR cancels its running gate
    # through the concurrency group below; the job itself is skipped.
    types: [opened, synchronize, reopened, closed]

permissions:
  checks: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR gate
    if: github.event.action != 'closed'
    # Same-repo PRs use the small ghostnet-gate ARC pool (256 MiB pods) so a
    # gate that polls for hours does not hold a macOS slot. Fork PRs stay on
    # hosted runners.
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'ghostnet-gate' || 'ubuntu-latest' }}
    # build-firmware.yml allows 360 minutes per build; 12 hours covers a queued
    # board build plus its run on the shared runners.
    timeout-minutes: 730
    steps:
      - name: Install the GitHub CLI when the runner image lacks it
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            exit 0
          fi
          version=2.63.2
          case "$(uname -m)" in
            aarch64|arm64) arch=arm64 ;;
            *) arch=amd64 ;;
          esac
          curl -fsSL "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_linux_${arch}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${version}_linux_${arch}/bin" >> "$GITHUB_PATH"
      - name: Wait for the PR's other checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SELF: PR gate
        run: |
          # Give path-filtered workflows time to register their check runs.
          sleep 60
          while :; do
            # The labeler only adds labels and runs from the base branch on
            # hosted runners, so it is not a test to wait on. The merge sweep
            # ("Handle passing PRs") is automation, not a test, and a
            # superseded sweep is cancelled by design.
            # Keep only the newest run per check name so a re-run replaces
            # the attempt it superseded.
            runs=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name != env.SELF and .name != "Manet merge gate" and .name != "Pull Request Labeler" and .name != "Handle passing PRs") | [.id, .status, (.conclusion // ""), .name] | @tsv' \
              | sort -t$'\t' -k4,4 -k1,1nr | awk -F'\t' '!seen[$4]++ { print $2 "\t" $3 "\t" $4 }')
            pending=$(printf '%s\n' "$runs" | awk -F'\t' '$1 != "completed" && $1 != ""' | wc -l)
            if [ "$pending" -eq 0 ]; then
              break
            fi
            echo "Waiting on $pending check(s)..."
            sleep 60
          done
          printf '%s\n' "$runs" | awk -F'\t' '$1 != "" { print $2 "\t" $3 }'
          failed=$(printf '%s\n' "$runs" | awk -F'\t' '$1 == "completed" && $2 != "success" && $2 != "skipped" && $2 != "neutral"')
          if [ -n "$failed" ]; then
            echo "::error::Failed checks:"
            printf '%s\n' "$failed"
            exit 1
          fi
          echo "All checks passed."
