name: Build host tools

on:
  pull_request:
    paths:
      - 'include/**'
      - 'tools/**'
      - '.github/workflows/tools.yml'
  push:
    paths:
      - 'include/**'
      - 'tools/**'
      - '.github/workflows/tools.yml'
    # Branch pushes with an open PR are already built by the pull_request
    # run; a second push-triggered build only doubles the load. Build the
    # base branch after merges instead.
    branches:
      - '24.10'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-tools:
    name: Build host tools for linux and macos based systems
    uses: openwrt/actions-shared-workflows/.github/workflows/tools.yml@main
