name: Hardware qualification tooling

on:
  pull_request:
    paths:
      - 'scripts/hardware-qualification/**'
      - '.github/workflows/hardware-qualification.yml'
  push:
    branches: ['24.10']
    paths:
      - 'scripts/hardware-qualification/**'
      - '.github/workflows/hardware-qualification.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualification-tools:
    name: Hardware qualification tooling tests
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Check build dependencies are installed
        # Preinstalled in the Mac Studio's Ubuntu VM: its runner user has no sudo.
        run: dpkg-query -W device-tree-compiler >/dev/null
      - run: python3 -m unittest discover -s scripts/hardware-qualification/tests -v
