name: Build Firmware (PR) on Venice

permissions:
  contents: read

on:
  pull_request:
    # Changes that touch every board (feeds pin, boards/common, the setup
    # script, build-firmware.yml) build only the smoke set on PRs: x86-64,
    # ekh-bcm2712 and halowlink2. This board is still built on PRs that
    # change its own files or the kernel, and by the 6-hourly full build
    # on 24.10 (build-full.yml).
    paths:
    - 'boards/venice/**'
    - 'patches/venice/**'
    - '.github/workflows/build-pr-venice.yml'
    - 'include/kernel*'
    - 'package/kernel/**'
    - 'target/linux/imx/**'

# A new PR revision supersedes the previous full image build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-venice:
    name: Build Venice
    uses: ./.github/workflows/build-firmware.yml
    with:
      board: venice
      target: imx
      subtarget: cortexa53
      description: "Gateworks Venice"
