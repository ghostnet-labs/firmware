name: Build Firmware (PR) on ht-hd01-v2

permissions:
  contents: read

on:
  pull_request:
    # Changes that touch every board (feeds pin, boards/common, the setup
    # script, build-firmware.yml) build only the smoke set on PRs: x86-64,
    # ekh-bcm2712 and halowlink2. This board is still built on PRs that
    # change its own files or the kernel, and by the 6-hourly full build
    # on 24.10 (build-full.yml).
    paths:
    - 'boards/ht-hd01-v2/**'
    - 'patches/ht-hd01-v2/**'
    - '.github/workflows/build-pr-hd01v2.yml'
    - 'include/kernel*'
    - 'package/kernel/**'
    - 'target/linux/ramips/**'

# A new PR revision supersedes the previous full image build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-hd01-v2:
    name: Build HD01 V2
    uses: ./.github/workflows/build-firmware.yml
    with:
      board: ht-hd01-v2
      target: ramips
      subtarget: mt76x8
      description: "Heltec HT-HD01 V2 (MT76x8)"
