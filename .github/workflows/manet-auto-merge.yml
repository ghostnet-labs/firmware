name: Handle passing PRs
on:
  workflow_run:
    workflows: ["Manet merge gate","Build Firmware","Build Firmware (PR) on bcm2710","Build Firmware (PR) on bcm2711","Build Firmware (PR) on bcm2712","Build Firmware (PR) on halowlink2","Build Firmware (PR) on ht-hd01-v2","Build Firmware (PR) on Venice","Build and Release Firmware","Issue Labeller","Build Kernel","Build kernel and check patches for target specified in labels","Build check target specified in labels","Pull Request Labeler","PR Gate","Build and Push prebuilt tools container","Build Toolchains","Build host tools"]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  pull_request_review:
    types: [submitted, dismissed]
  # Revisit dependencies and resolved conversations that have no local CI event.
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
concurrency:
  group: manet-auto-merge
  cancel-in-progress: false
jobs:
  merge:
    name: Handle passing PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ghostnet-labs/docs
          ref: c733cc3720d65fd5ae274ed9acb216023c352dec
          persist-credentials: false
      - name: Merge only eligible, protected PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 project/scripts/merge_policy.py merge --repo "$REPO"
