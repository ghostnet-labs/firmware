# OpenMANET V1 carrier floorplan model (GHO-7).
#
# Baseline: ghostnet-labs/docs project/hardware/v1-reference.md §18 (first-pass
# 2D floorplan, 2026-09-30) and project/hardware/v1-battery-pack.md (M-xx).
#
# Frame: origin at the PCB's lower-left corner, X along the 117 mm edge,
# Y along the 67 mm edge (Y up), Z up from the PCB top surface. Bottom-side
# parts have negative Z. All units mm.
#
# Every part is either:
#   status: envelope    -> box from a dimension in the V1 reference
#   status: drawing     -> box from a manufacturer drawing's max dimensions
#   status: assumption  -> box from a working assumption that must be confirmed
#   status: blocked     -> no trustworthy geometry yet; not placed, listed in
#                          the report as a blocker
# A manufacturer STEP in step/<step> replaces the box when present; set
# step_offset/step_rot so the model lands on the same footprint, then rerun.
#
# Flags: rf (RF module: no switching parts over or under it), switching
# (power part covered by the RF and GNSS-distance rules), edge_ok (allowed to
# reach the board edge), no_height (height unknown; left out of height results).

board:
  w: 138.0  # GHO-37: grown from 117 mm for the M.2 3052 Wi-Fi card
  d: 67.0
  thickness: 1.6          # assumption: stackup open (GHO-14)
  edge_clearance: 1.5     # §18: component-to-wall clearance assumption
  wall: 2.0               # §18: enclosure wall assumption
  gnss_min_distance: 15.0 # §18 rule: every power part ≥ 15 mm from the GNSS receiver

parts:
  # ---------------------------------------------------------------- top side
  - id: cm5
    name: Raspberry Pi CM5008032
    kind: module
    status: envelope
    # CM5 datasheet (RP-008180-DS-7) §4.1.1: 55 × 40 mm, PCB 1.24 mm, bare
    # module 4.6 mm deep, 4.0 mm stacking height with Amphenol
    # 10164227-1004A1RLF (2.5 mm clearance underneath), 7.44 mm mounted.
    # Official STEP (CM5R5-3dsteps.step) spans Z -1.11..3.51 about the PCB
    # underside, so the module occupies Z 2.89..7.51 once mated.
    source: "CM5 datasheet §4.1.1 and official STEP; §18 X 31–86, Y 24–64"
    x: 31.0
    y: 24.0
    w: 55.0
    d: 40.0
    z0: 2.89
    h: 4.62
    step: cm5.step
    step_offset: [0.0, 0.0, 1.11]

  - id: cm5_conn_a
    name: Amphenol 10164227-1004A1RLF CM5 board-to-board connector (lower)
    kind: b2b
    status: drawing
    # Amphenol STEP: 22.6 × 3.38 mm body, 3.9 mm tall, single surface shell.
    # Centered under the matching module-side connector in the official CM5
    # STEP (module X 14.24–35.76, Y 1.51–4.49), i.e. board X 56.0, Y 27.0.
    source: "Amphenol STEP placed under the CM5 STEP's connector"
    x: 44.7
    y: 25.31
    w: 22.6
    d: 3.38
    z0: 0.0
    h: 3.9
    step: amphenol_10164227-1004a1rlf.step
    step_offset: [11.3, 1.69, 0.04]

  - id: cm5_conn_b
    name: Amphenol 10164227-1004A1RLF CM5 board-to-board connector (upper)
    kind: b2b
    status: drawing
    # Amphenol STEP: 22.6 × 3.38 mm body, 3.9 mm tall, single surface shell.
    # Centered under the matching module-side connector in the official CM5
    # STEP (module X 14.24–35.76, Y 35.52–38.49), i.e. board X 56.0, Y 61.0.
    source: "Amphenol STEP placed under the CM5 STEP's connector"
    x: 44.7
    y: 59.31
    w: 22.6
    d: 3.38
    z0: 0.0
    h: 3.9
    step: amphenol_10164227-1004a1rlf.step
    step_offset: [11.3, 1.69, 0.04]

  - id: cm5_underside
    name: CM5 underside keepout (top side)
    kind: keepout
    status: envelope
    source: "§18 / §5: no inductors, switching regulators, tall capacitors or connectors under the CM5"
    x: 31.0
    y: 24.0
    w: 55.0
    d: 40.0
    z0: 0.0
    h: 2.5
    bans: [inductor, regulator, connector, power_region, socket]

  - id: halow_card
    name: Gateworks GW16170 (M.2 2230)
    kind: module
    status: envelope
    rf: true
    # Gateworks STEP (GW16170A.STEP, SolidWorks surface export): card 22 × 30 ×
    # 0.79 mm with the gold fingers at its Y 0 edge, top-side parts to 4.0 mm
    # above the card, bottom-side parts to 0.7 mm below it, and the edge
    # antenna connector overhanging the far end by 0.7 mm. The TE socket
    # holds the card centered 1.6 mm above the carrier, so its underside is
    # at 1.2 mm.
    source: "§18: HaLow M.2 X 4–26, Y 34–64, antenna end toward the top wall; Gateworks STEP; seated per the TE STEP"
    x: 7.0   # D-025: §18 X 4, moved 3 mm toward the CM5 to free the corner
    y: 34.0
    w: 22.0
    d: 30.0
    z0: 0.0
    h: 3.5
    step: gw16170.step
    step_offset: [0.0, 0.0, 1.2]

  - id: halow_socket
    name: TE 2199119-6 M.2 E-key socket (HaLow)
    kind: socket
    status: envelope
    # TE STEP (c-2199119-6-c-3d.stp): body 21.9 × 8.7 mm, 2.99 mm above the
    # PCB, card slot centered 1.6 mm above the PCB, slot floor 4.45 mm in
    # from the open face. Modeled with Y up and the slot along -Z, so it is
    # turned +90° about X and 180° about Z to face the card (+Y). The card's
    # finger edge sits on the slot floor, 4.45 mm inside the socket.
    source: "TE STEP; placed so the §18 card edge (Y 34) sits on the slot floor"
    x: 7.05  # follows halow_card
    y: 30.1
    w: 21.9
    d: 8.7
    z0: 0.0
    h: 3.0
    step: te_2199119-6.step
    step_rotx: 90.0
    step_rot: 180.0
    step_offset: [10.95, 8.35, 1.6]

  - id: wifi_card
    name: AsiaRF AW7916-AED (M.2 3052 A+E key)
    kind: module
    status: envelope
    rf: true
    # GHO-37: the AIW-170BQ can't run an 802.11s mesh point, so V1 moves to
    # the MT7916 card. At 30 x 52 mm it needs its own column right of the
    # CM5, so the board grows from 117 to 138 mm and the GNSS gets a column
    # of its own at the right edge. No STEP published; box from the vendor
    # size, seated like the HaLow card, thickness assumed.
    source: "GHO-37: AsiaRF datasheet 52 x 30 mm; X 88-118, Y 10.9-62.9, antenna end toward the top wall; thickness assumed"
    x: 88.0
    y: 10.9
    w: 30.0
    d: 52.0
    z0: 1.2
    h: 2.4

  - id: wifi_socket
    name: TE 2199119-6 M.2 E-key socket (Wi-Fi)
    kind: socket
    status: envelope
    # TE STEP (c-2199119-6-c-3d.stp): body 21.9 × 8.7 mm, 2.99 mm above the
    # PCB, card slot centered 1.6 mm above the PCB, slot floor 4.45 mm in
    # from the open face. Modeled with Y up and the slot along -Z, so it is
    # turned +90° about X and 180° about Z to face the card (+Y). The card's
    # finger edge sits on the slot floor, 4.45 mm inside the socket.
    source: "TE STEP; placed so the §18 card edge (Y 34) sits on the slot floor"
    x: 92.05 # follows wifi_card (centered on its 30 mm edge)
    y: 7.0
    w: 21.9
    d: 8.7
    z0: 0.0
    h: 3.0
    step: te_2199119-6.step
    step_rotx: 90.0
    step_rot: 180.0
    step_offset: [10.95, 8.35, 1.6]

  - id: eth_feedthrough
    name: Amphenol LTW RCP-5SPFFH-SCU7001 sealed Ethernet feed-through (left wall)
    kind: connector
    status: drawing
    edge_ok: true
    # D-022 / B-06: panel-mount feed-through with an RJ45 socket on the inside;
    # not soldered to the carrier. STEP is LTW's equivalent model for the
    # family (rcp-5spffh-scm7001_eq_asm.stp, saved here under this name). In
    # STEP coordinates the axis runs along +X into the enclosure, centered on
    # Y = Z = 0, and the panel (≤ 3.0 mm) sits on the inner face of the nut.
    # Placed with that inner panel face at X = -1.5 (wall clearance), the
    # axis at Y 14 (center of the §18 Ethernet zone) and Z 12, so the inner
    # body clears the PCB top by about 1 mm. Axis height is an assumption.
    source: "LTW drawing RCP-6APFFH-SCM7001 rev A (37 mm deep, 15 mm thread, Ø20.8 mm cut-out) and LTW equivalent STEP; axis Y 14, Z 12 assumed"
    x: 0.0
    y: 14.0
    w: 0.0
    d: 0.0
    z0: 0.0
    h: 0.0
    step: ltw_rcp-5spffh-scu7001.step
    step_offset: [1.0, 0.0, 12.0]

  - id: eth_plug
    name: RJ45 plug and boot in the feed-through's inner jack
    kind: connector
    status: assumption
    # Plug body ~11.7 × 13.5 mm plus boot, modeled as 16 × 16 mm around the
    # connector axis (Y 14, Z 12), 20.5 mm past the feed-through's inner end.
    # Its underside is 4 mm above the PCB, so low parts (USB hub, magnetics
    # up to 3.5 mm) can sit under it.
    source: "D-025: RJ45 plug + boot 16 × 16 mm around the connector axis, X 20–40.5; replaces the 25 × 25 mm envelope"
    x: 20.0
    y: 6.0
    w: 20.5
    d: 16.0
    z0: 4.0
    h: 16.0

  - id: eth_cable
    name: Pigtail bend from the plug down to the board header
    kind: connector
    status: assumption
    source: "D-025: thin 8-wire pigtail turning down and toward the bottom edge, X 40.5–48, Y 2–22, above 3.5 mm"
    x: 40.5
    y: 2.0
    w: 7.5
    d: 20.0
    z0: 3.5
    h: 16.5

  - id: eth_header
    name: Molex Pico-Lock 504050-0891 8-pin right-angle header, mated with 504051-0801
    kind: connector
    status: drawing
    # GHO-45: Pico-Lock 1.50 mm pitch, positive lock, 2.0 mm mated height.
    # Box covers header plus mated housing (opening toward +Y, toward the
    # plug): ~13.5 mm wide (derived from pitch), 7.5 mm deep to stay 0.5 mm clear of the USB hub (assumed until
    # sales drawing SD-504050-001 is checked). Pins 1/2, 3/4, 5/6, 7/8 carry
    # MDI0..3 pairs (MDI side of the magnetics).
    source: "GHO-45: Molex 504050-0891 + 504051-0801, 2.0 mm mated height (Molex); width derived, depth assumed"
    x: 41.0
    y: 2.0
    w: 13.5
    d: 7.5
    z0: 0.0
    h: 2.0

  - id: power_input
    name: Power-input termination (behind the bottom-wall receptacle)
    kind: connector
    status: assumption
    no_height: true
    edge_ok: true
    source: "§18: placeholder X 26–38, Y 0.5–8.5 on the bottom edge"
    x: 26.0
    y: 0.5
    w: 12.0
    d: 8.0
    z0: 0.0
    h: 0.1

  - id: usb_hub
    name: TI TUSB4020BI with support parts
    kind: ic
    status: envelope
    source: "§18: X 39–53, Y 10–24"
    x: 39.0
    y: 10.0
    w: 14.0
    d: 14.0
    z0: 0.0
    h: 1.2

  - id: gnss
    name: u-blox MAX-M10S-00B with RF front end
    kind: gnss
    status: envelope
    source: "§18: X 96–112, Y 5–19, corner farthest from the HaLow module; GHO-37 moves it right of the Wi-Fi card"
    x: 120.5 # GHO-37: own column at the right edge of the 138 mm board
    y: 7.0   # D-025: §18 Y 5, moved 2 mm up to clear the lower-right boss
    w: 16.0
    d: 14.0
    z0: 0.0
    h: 2.5

  # ------------------------------------------------------------- bottom side
  # Heights below the board are not specified; 3 mm is assumed for all.
  - id: bucks
    name: 5 V and 3.3 V LM76005 bucks (bottom)
    kind: power_region
    status: envelope
    switching: true
    source: "§18 bottom side: X 30–66, Y 3–17; 3 mm height assumed"
    x: 30.0
    y: 3.0
    w: 36.0
    d: 14.0
    z0: -4.6
    h: 3.0

  - id: charger
    name: BQ25798 charger with TPS25751A PD controller (bottom)
    kind: power_region
    status: envelope
    switching: true
    source: "§18 bottom side: X 38–60, Y 26–42, under the CM5; 3 mm height assumed"
    x: 38.0
    y: 26.0
    w: 22.0
    d: 16.0
    z0: -4.6
    h: 3.0

  - id: efuse
    name: TPS26633 eFuse block (bottom)
    kind: power_region
    status: envelope
    switching: true
    source: "§18 bottom side: X 62–80, Y 26–36, under the CM5; 3 mm height assumed"
    x: 62.0
    y: 26.0
    w: 18.0
    d: 10.0
    z0: -4.6
    h: 3.0

  - id: shunt
    name: Shunt and INA228 (bottom)
    kind: power_region
    status: envelope
    switching: true
    source: "§18 bottom side: X 70–82, Y 3–11; 3 mm height assumed"
    x: 68.0  # D-025: §18 X 70, moved 2 mm left to meet the 15 mm GNSS rule
    y: 3.0
    w: 12.0
    d: 8.0
    z0: -4.6
    h: 3.0

  - id: supervisor
    name: TPS386000 supervisor (bottom)
    kind: ic
    status: envelope
    source: "§18 bottom side: X 70–79, Y 13–22; 3 mm height assumed"
    x: 70.0
    y: 13.0
    w: 9.0
    d: 9.0
    z0: -4.6
    h: 3.0

  - id: pack_contacts
    name: Pack pogo daughterboard zone (Mill-Max 7911 × 8, below the carrier)
    kind: keepout
    status: assumption
    # M-10 centers the 4 × 2 array at X 117, Y 37 in the 145 × 74 pack frame
    # (grown from 124 mm with the board, GHO-37), viewed from the battery
    # side; M-14 sizes the daughterboard ~24 × 16 mm. Assumed: board centered
    # in that frame (3.5 mm margins) and the view mirrored in X, which puts
    # the center at board (24.5, 33.5). If the mirror is in Y instead, the
    # center is board (113.5, 33.5). Either way it sits under an M.2 radio.
    # Mounting is to the enclosure, not the carrier.
    source: "M-10/M-14: 24 × 16 mm at board X 12.5–36.5, Y 25.5–41.5 (frame mapping assumed)"
    x: 12.5
    y: 25.5
    w: 24.0
    d: 16.0
    z0: -12.0
    h: 10.4
    bans: [power_region, ic, connector]

  # ------------------------------------- GHO-7: Ethernet magnetics, OpenVLM port
  # Kept in their own block, apart from eth_header / usb_hub (GHO-45) so the
  # branches merge cleanly. The old §18 magnetics placeholder (14 × 9 mm at
  # X 23–37, Y 12–21, under the RJ45 plug) is replaced by eth_magnetics below.

  - id: eth_magnetics
    name: Pulse HX5120NL 1000BASE-T magnetics (candidate, GHO-11)
    kind: ic
    status: drawing
    # Pulse drawing HX5120NL-10 / PS-2422.001-B, datasheet rev A (2014),
    # sheet 3: body 16.51 × 9.14 mm (0.380 in = 9.65 mm max over the gull-wing
    # leads), 2.08 mm max seated height, 24 leads on 1.27 mm pitch. Suggested
    # land pattern: 0.76 mm pads, 7.37 mm between the pad rows, 10.67 mm
    # overall. Box = 16.51 × 10.67 mm land-pattern envelope × 2.08 mm.
    # Pins 1–12 (TD/TDCT, PHY side) on one long side, 13–24 (TX/TXCT, line
    # side) on the other; 1500 Vrms isolation, -40 to +85 °C (sheet 2).
    # Long axis along X. PHY row faces +Y toward the CM5 connector
    # (cm5_conn_a, Y 25.31), leaving 3.6 mm for the two TPD4EUSB30 and the
    # centre-tap caps; line row faces -Y toward the Pico-Lock header (GHO-45:
    # X 41–56.95, Y 1.5–9.5), 1.5 mm away. 1.0 mm clear of the USB hub
    # (X 53). Which end of cm5_conn_a carries the MDI pins (CM5 pins 3–12)
    # is assumed, not checked against the CM5 pin-1 position.
    source: "Pulse HX5120NL drawing (PS-2422.001-B): 16.51 × 10.67 mm land envelope, 2.08 mm; X 54–70.51, Y 11–21.67"
    x: 54.0
    y: 11.0
    w: 16.51
    d: 10.67
    z0: 0.0
    h: 2.08

  - id: usbc_host
    name: GCT USB4720-03-A sealed USB-C receptacle, OpenVLM host port (D-023, B-23)
    kind: connector
    status: drawing
    edge_ok: true
    # GCT drawing USB4720 rev B (2025-01-02), sheet 1: mid-mount horizontal,
    # 11.30 mm over the shell tabs, 7.60 mm ref long, front 1.28 mm past the
    # PCB edge, board notch 9.05 mm wide and 4.30 mm deep. Gasket flange
    # 3.75 mm tall: 2.13 mm above and 1.62 mm below the PCB top surface
    # (shell 2.56 mm, axis about Z 0.35). No STEP: GCT serves its models
    # through a CADENAS generator that can't be scripted from here.
    # Bottom wall (Y 0), centred at X 86.5: clear of the B-07 charge/service
    # port (power_input, X 26–38, same wall, 43 mm away), of the left-wall
    # Ethernet feed-through (outside the wall it ends at X 20), of the top
    # RF wall and of the right-wall GNSS column (X 120.5). The pack hooks and
    # latch are at the two short ends (M-19, M-20), so a long-wall port stays
    # out of the insertion path. GCT's layout is drawn for a 0.6 ± 0.1 mm
    # board; this carrier is about 1.6 mm (GHO-14), so the shell-tab
    # soldering and the body's 1.62 mm below the top surface need GCT's
    # confirmation (the same applies to B-07).
    source: "GCT USB4720 drawing rev B: 11.30 × 7.60 mm, 1.28 mm past the board edge, Z -1.62..2.13; X 80.85–92.15 on the bottom edge (position proposed)"
    x: 80.85
    y: -1.28
    w: 11.30
    d: 7.60
    z0: -1.62
    h: 3.75

  - id: usbc_host_support
    name: OpenVLM port DFP parts (CC controller, VBUS switch, USB and CC ESD, bulk cap)
    kind: ic
    status: assumption
    # v1-openvlm-usbc-power.md leading option: TUSB320LAI + TPS2553, plus USB
    # data-line ESD (no part selected). Small SMD parts, 1.2 mm assumed.
    # Between the magnetics (1.5 mm) and the receptacle (0.85 mm).
    source: "Assumed 8 × 8 mm block for the DFP parts (v1-openvlm-usbc-power.md); parts not selected"
    x: 72.0
    y: 2.0
    w: 8.0
    d: 8.0
    z0: 0.0
    h: 1.2

  - id: usbc_host_route_a
    name: USB 2.0 pair, OpenVLM port to hub downstream port 3 (rising leg, inner layer)
    kind: keepout
    status: assumption
    # A routing channel, not a part: the receptacle is soldered to the
    # carrier, so the "cable path" to the hub is a 90 ohm pair. It rises
    # beside the magnetics, then runs west above them (route_b) to the hub's
    # east side. It must stay out of the magnetics' line-side region (no logic
    # ground on any layer, v1-stackup-routing.md §4) and cross the PHY-side
    # MDI pairs on another layer. About 45 mm long. Port 3 pin position on the
    # TUSB4041I package is assumed to face east.
    source: "Proposed USB 2.0 channel X 72–80, Y 10–23.8 inside the PCB; port-3 pin side assumed"
    x: 72.0
    y: 10.0
    w: 8.0
    d: 13.8
    z0: -1.6
    h: 1.6
    bans: []

  - id: usbc_host_route_b
    name: USB 2.0 pair, OpenVLM port to hub downstream port 3 (west leg, inner layer)
    kind: keepout
    status: assumption
    source: "Proposed USB 2.0 channel X 53–80, Y 22–23.8 inside the PCB, between the magnetics and the CM5 keepout"
    x: 53.0
    y: 22.0
    w: 27.0
    d: 1.8
    z0: -1.6
    h: 1.6
    bans: []

  - id: usbc_host_wall
    name: OpenVLM port wall opening, sealing land and gasket counterbore (bottom wall)
    kind: keepout
    status: assumption
    edge_ok: true
    # GCT recommended panel (drawing sheet 2): 8.44 × 2.66 mm opening, 10°
    # draft, counterbore 9.14/9.64 × 3.35/3.86 mm, 0.67 mm deep, 1.80 mm ref
    # panel, gasket compressed between the panel's inner face and the shell
    # flange. The 2.0 mm wall (assumed) therefore needs a local spot-face to
    # 1.8 mm, and its inner face must meet the gasket flange, about 0.7 to
    # 1.0 mm inside the model's 1.5 mm board-to-wall gap: a local inward land
    # (or a board tab) whose size waits for the GCT STEP. Box: wall thickness
    # plus that land, 2 mm of flat sealing land round the counterbore. No
    # boss may sit here.
    source: "GCT USB4720 recommended panel spec; wall Y -3.5..-0.6, 2 mm land round the 9.64 × 3.86 mm counterbore; land depth assumed"
    x: 79.5
    y: -3.5
    w: 14.0
    d: 2.9
    z0: -3.7
    h: 7.9
    bans: [mount]

  - id: usbc_host_access
    name: OpenVLM male-to-male USB-C cable, plug and hand-access envelope (outside the bottom wall)
    kind: access
    status: assumption
    edge_ok: true
    # GCT mating view: plug overmold up to 6.5 mm tall, about 2.2 mm off the
    # panel's outer face. Assumed: overmold 12.5 × 6.5 × 24 mm, then a
    # 25 mm bend radius turning the cable up (away from the pack below the
    # radio, so it can't foul the pack's hook-and-pivot insertion), and a
    # 24 mm wide finger zone to grip the plug. The OpenVLM VLMKW0100 cable is
    # not selected. Out to Y -58, X 74.5–98.5, Z -6..28.
    source: "Assumed USB-C cable access envelope: 24 mm wide, 54.5 mm out from the wall, Z -6..28 (cable bend up, R 25 mm)"
    x: 74.5
    y: -58.0
    w: 24.0
    d: 54.5
    z0: -6.0
    h: 34.0

  # ----------------------------------------------------------- mounting
  - id: boss_ll
