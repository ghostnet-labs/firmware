# OpenMANET V1 carrier floorplan model (GHO-7).
#
# Baseline: ghostnet-labs/docs project/hardware/v1-reference.md §18 (first-pass
# 2D floorplan, 2026-09-30) and project/hardware/v1-battery-pack.md (M-xx).
#
# Frame: origin at the PCB's lower-left corner, X along the 117 mm edge,
# Y along the 67 mm edge (Y up), Z up from the PCB top surface. Bottom-side
# parts have negative Z. All units mm.
#
# Every part is either:
#   status: envelope    -> box from a dimension in the V1 reference
#   status: drawing     -> box from a manufacturer drawing's max dimensions
#   status: assumption  -> box from a working assumption that must be confirmed
#   status: blocked     -> no trustworthy geometry yet; not placed, listed in
#                          the report as a blocker
# A manufacturer STEP in step/<step> replaces the box when present; set
# step_offset/step_rot so the model lands on the same footprint, then rerun.
#
# Flags: rf (RF module: no switching parts over or under it), switching
# (power part covered by the RF and GNSS-distance rules), edge_ok (allowed to
# reach the board edge), no_height (height unknown; left out of height results).

board:
  w: 117.0
  d: 67.0
  thickness: 1.6          # assumption: stackup open (GHO-14)
  edge_clearance: 1.5     # §18: component-to-wall clearance assumption
  wall: 2.0               # §18: enclosure wall assumption
  gnss_min_distance: 15.0 # §18 rule: every power part ≥ 15 mm from the GNSS receiver

parts:
  # ---------------------------------------------------------------- top side
  - id: cm5
    name: Raspberry Pi CM5008032
    kind: module
    status: envelope
    # CM5 datasheet (RP-008180-DS-7) §4.1.1: 55 × 40 mm, PCB 1.24 mm, bare
    # module 4.6 mm deep, 4.0 mm stacking height with Amphenol
    # 10164227-1004A1RLF (2.5 mm clearance underneath), 7.44 mm mounted.
    # Official STEP (CM5R5-3dsteps.step) spans Z -1.11..3.51 about the PCB
    # underside, so the module occupies Z 2.89..7.51 once mated.
    source: "CM5 datasheet §4.1.1 and official STEP; §18 X 31–86, Y 24–64"
    x: 31.0
    y: 24.0
    w: 55.0
    d: 40.0
    z0: 2.89
    h: 4.62
    step: cm5.step
    step_offset: [0.0, 0.0, 1.11]

  - id: cm5_underside
    name: CM5 underside keepout (top side)
    kind: keepout
    status: envelope
    source: "§18 / §5: no inductors, switching regulators, tall capacitors or connectors under the CM5"
    x: 31.0
    y: 24.0
    w: 55.0
    d: 40.0
    z0: 0.0
    h: 2.5
    bans: [inductor, regulator, connector, power_region, socket]

  - id: halow_card
    name: Gateworks GW16170 (M.2 2230)
    kind: module
    status: envelope
    rf: true
    source: "§18: HaLow M.2 X 4–26, Y 34–64, antenna end toward the top wall; 30 × 22 × 3.5 mm"
    x: 4.0
    y: 34.0
    w: 22.0
    d: 30.0
    z0: 0.0
    h: 3.5
    step: gw16170.step

  - id: halow_socket
    name: TE 2199119-6 M.2 E-key socket (HaLow)
    kind: socket
    status: envelope
    # §18 gives the card only. The socket body sits at the card's finger end;
    # modeled conservatively with no finger overlap until the TE STEP lands.
    source: "~21.9 × 8.7 × 3.2 mm, below the card's finger end (position assumed)"
    x: 4.05
    y: 25.3
    w: 21.9
    d: 8.7
    z0: 0.0
    h: 3.2
    step: te_2199119-6.step

  - id: wifi_card
    name: Advantech AIW-170BQ-001 (M.2 2230)
    kind: module
    status: envelope
    rf: true
    source: "§18: Wi-Fi M.2 X 91–113, Y 34–64, antenna end toward the top wall; 30 × 22 × 2.2 mm"
    x: 91.0
    y: 34.0
    w: 22.0
    d: 30.0
    z0: 0.0
    h: 2.2
    step: aiw-170bq.step

  - id: wifi_socket
    name: TE 2199119-6 M.2 E-key socket (Wi-Fi)
    kind: socket
    status: envelope
    source: "~21.9 × 8.7 × 3.2 mm, below the card's finger end (position assumed)"
    x: 91.05
    y: 25.3
    w: 21.9
    d: 8.7
    z0: 0.0
    h: 3.2
    step: te_2199119-6.step

  - id: eth_connector
    name: Amphenol LTW RCP-6APFFH-SCM7001 sealed Ethernet receptacle (keepout)
    kind: connector
    status: assumption
    no_height: true
    edge_ok: true
    source: "B-06 / §18: 20 × 20 mm placeholder keepout X 1–21, Y 4–24 on the left edge; drawing and STEP to request from Amphenol LTW"
    x: 1.0
    y: 4.0
    w: 20.0
    d: 20.0
    z0: 0.0
    h: 0.1
    step: ltw_rcp-6apffh-scm7001.step

  - id: eth_magnetics
    name: Discrete 1000BASE-T magnetics module
    kind: ic
    status: assumption
    no_height: true
    source: "§18: 14 × 9 mm placeholder X 23–37, Y 12–21; part not selected"
    x: 23.0
    y: 12.0
    w: 14.0
    d: 9.0
    z0: 0.0
    h: 0.1

  - id: power_input
    name: Power-input termination (behind the bottom-wall receptacle)
    kind: connector
    status: assumption
    no_height: true
    edge_ok: true
    source: "§18: placeholder X 26–38, Y 0.5–8.5 on the bottom edge"
    x: 26.0
    y: 0.5
    w: 12.0
    d: 8.0
    z0: 0.0
    h: 0.1

  - id: usb_hub
    name: TI TUSB4020BI with support parts
    kind: ic
    status: envelope
    source: "§18: X 39–53, Y 10–24"
    x: 39.0
    y: 10.0
    w: 14.0
    d: 14.0
    z0: 0.0
    h: 1.2

  - id: gnss
    name: u-blox MAX-M10S-00B with RF front end
    kind: gnss
    status: envelope
    source: "§18: X 96–112, Y 5–19, corner farthest from the HaLow module"
    x: 96.0
    y: 5.0
    w: 16.0
    d: 14.0
    z0: 0.0
    h: 2.5

  # ------------------------------------------------------------- bottom side
  # Heights below the board are not specified; 3 mm is assumed for all.
  - id: bucks
    name: 5 V and 3.3 V LM76005 bucks (bottom)
    kind: power_region
    status: envelope
    switching: true
    source: "§18 bottom side: X 30–66, Y 3–17; 3 mm height assumed"
    x: 30.0
    y: 3.0
    w: 36.0
    d: 14.0
    z0: -4.6
    h: 3.0

  - id: charger
    name: BQ25798 charger with TPS25751A PD controller (bottom)
    kind: power_region
    status: envelope
    switching: true
    source: "§18 bottom side: X 38–60, Y 26–42, under the CM5; 3 mm height assumed"
    x: 38.0
    y: 26.0
    w: 22.0
    d: 16.0
    z0: -4.6
    h: 3.0

  - id: efuse
    name: TPS26633 eFuse block (bottom)
    kind: power_region
    status: envelope
    switching: true
    source: "§18 bottom side: X 62–80, Y 26–36, under the CM5; 3 mm height assumed"
    x: 62.0
    y: 26.0
    w: 18.0
    d: 10.0
    z0: -4.6
    h: 3.0

  - id: shunt
    name: Shunt and INA228 (bottom)
    kind: power_region
    status: envelope
    switching: true
    source: "§18 bottom side: X 70–82, Y 3–11; 3 mm height assumed"
    x: 70.0
    y: 3.0
    w: 12.0
    d: 8.0
    z0: -4.6
    h: 3.0

  - id: supervisor
    name: TPS386000 supervisor (bottom)
    kind: ic
    status: envelope
    source: "§18 bottom side: X 70–79, Y 13–22; 3 mm height assumed"
    x: 70.0
    y: 13.0
    w: 9.0
    d: 9.0
    z0: -4.6
    h: 3.0

  - id: pack_contacts
    name: Pack pogo daughterboard zone (Mill-Max 7911 × 8, below the carrier)
    kind: keepout
    status: assumption
    # M-10 centers the 4 × 2 array at X 96, Y 37 in the 124 × 74 pack frame,
    # viewed from the battery side; M-14 sizes the daughterboard ~24 × 16 mm.
    # Assumed: board centered in that frame (3.5 mm margins) and the view
    # mirrored in X, which puts the center at board (24.5, 33.5). If the
    # mirror is in Y instead, the center is board (92.5, 33.5). Either way it
    # sits under an M.2 radio. Mounting is to the enclosure, not the carrier.
    source: "M-10/M-14: 24 × 16 mm at board X 12.5–36.5, Y 25.5–41.5 (frame mapping assumed)"
    x: 12.5
    y: 25.5
    w: 24.0
    d: 16.0
    z0: -12.0
    h: 10.4
    bans: [power_region, ic, connector]

  # ----------------------------------------------------------- mounting
  - id: boss_ll
    name: M3 enclosure boss (lower-left)
    kind: mount
    status: assumption
    source: "§18: four M3 points; position and boss diameter not defined, 7 mm keepout at 4 mm corner inset assumed"
    x: 0.5
    y: 0.5
    w: 7.0
    d: 7.0
    z0: -6.0
    h: 26.0
    edge_ok: true
  - id: boss_lr
    name: M3 enclosure boss (lower-right)
    kind: mount
    status: assumption
    source: "same as boss_ll"
    x: 109.5
    y: 0.5
    w: 7.0
    d: 7.0
    z0: -6.0
    h: 26.0
    edge_ok: true
  - id: boss_ul
    name: M3 enclosure boss (upper-left)
    kind: mount
    status: assumption
    source: "same as boss_ll"
    x: 0.5
    y: 59.5
    w: 7.0
    d: 7.0
    z0: -6.0
    h: 26.0
    edge_ok: true
  - id: boss_ur
    name: M3 enclosure boss (upper-right)
    kind: mount
    status: assumption
    source: "same as boss_ll"
    x: 109.5
    y: 59.5
    w: 7.0
    d: 7.0
    z0: -6.0
    h: 26.0
    edge_ok: true

  # ----------------------------------------------------------- blocked
  - id: cm5_connectors
    name: Amphenol 10164227-1004A1RLF × 2 (CM5 board-to-board)
    kind: connector
    status: blocked
    source: "inside the CM5 footprint; needs the Amphenol STEP for exact position"
    step: amphenol_10164227-1004a1rlf.step
  - id: radio_load_switches
    name: TPS22975 radio load switches (one beside each radio)
    kind: ic
    status: blocked
    source: "§18 gives no coordinates"
  - id: rf_connectors
    name: Enclosure RF bulkheads (HaLow, 2 × Wi-Fi, GNSS) and pigtails
    kind: connector
    status: blocked
    source: "§18 CAD blockers: connector types and part numbers not selected"
  - id: enclosure
    name: Aluminum enclosure, lid, bosses and pack interface plate
    kind: enclosure
    status: blocked
    source: "§18: not frozen"
